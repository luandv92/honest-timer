name: release

# Publishes to npm when a version tag is pushed.
#
# No token is stored anywhere: this uses npm Trusted Publishing (OIDC), where npm
# verifies this workflow's identity instead of a long-lived secret. A token in a
# repository secret is a token that can leak; this cannot.
#
# ⚠️ THIS CANNOT DO THE *FIRST* PUBLISH, and that is an npm limitation, not a
# mistake here. A trusted publisher is configured in a package's settings page on
# npmjs.com — which only exists once the package does. Chicken and egg. PyPI
# solved it with "pending publishers"; npm has not (npm/cli#8544).
#
# So the very first `honest-timer` release has to be pushed by a human, once:
#
#   npm login
#   npm publish --access public
#
# After that, one-time setup on npmjs.com
# (Package settings -> Trusted Publisher -> GitHub Actions):
#   Organization or user: luandv92
#   Repository:           honest-timer
#   Workflow filename:    release.yml
#
# From then on every `git tag vX.Y.Z && git push --tags` publishes with no secret
# involved.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm ci`: this package has zero dependencies and ships no lockfile,
      # and `npm ci` fails outright when there is no package-lock.json.
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing needs npm >= 11.5.1; the version bundled with the
      # runner's Node is older than that, so upgrade before publishing.
      - run: npm install -g npm@latest
      - run: npm publish --access public
